name: CI/CD Pipeline & VPS Deployment

on:
  push:
    branches:
      - main
      - master

env:
  COMPOSE_PROJECT_NAME: rhyisa-backend

jobs:
  ci_check:
    name: CI Check & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: NestJS Production Build Check
        run: npm run build

  build_and_push:
    name: Build & Push Docker Image
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rhyisa-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rhyisa-backend:${{ github.sha }}

