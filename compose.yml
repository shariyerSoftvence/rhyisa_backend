name: rhyisa-backend

services:
  app:
    image: ${DOCKER_IMAGE:-rhyisa-backend:latest}
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      - postgres_db
      - redis_db

  postgres_db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rhisya-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhisya}
      POSTGRES_DB: ${POSTGRES_DB:-rhisya-db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_db:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
