
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: rhisya-user
      POSTGRES_PASSWORD: rhisya
      POSTGRES_DB: rhisya-db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: